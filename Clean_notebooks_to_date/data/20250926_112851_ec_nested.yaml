bounds:
  tau_ms:         [5.0, 200.0]
  dend_threshold: [-65.0, -25.0]
  weights_mean:   [0.1, 1.0]
  weights_std:    [0.1, 1.0]

# ---- args your stage reads via `context` ----
kwargs:
  data_root: /Users/michaelfinch/CA1-interneuron-GLM
  animal: animal_3

  # IMPORTANT: your stage uses these names inside compute_features/config_worker
  dend_threshold: -70           # <- you reference context.dend_threshold
  vel_applied: "real"           # "real" | "constant" | "average"
  use_averaged_velocity: "actual_velocity"
  add_inh: "neither"            # "both" | "sst" | "neither"
  make_it_spike: true
  SST_bias_multi: 1.4

  # if you want kwargs to override values set inside config_worker:
  dist: "Lognormal"             # keep consistent with your code
  tau_ms: 5.0
  dt_constant: 0.0001

  # seeds
  network_start_seed: 0
  num_network_seeds: 5          # CLI can override with --num_network_seeds

  # (optional switches you had; align names with code if you actually use them)
  # ec_animal_average: false
  # weight_dist: Lognormal

# ---- stage hooks ----
stages:
  - source: ec_nested_stage   # adjust to your importable module path
    config_worker: config_worker                      # <— add this; you defined it
    get_args_static: get_args                         # ok to keep this name if your nested version expects it
    compute_features: compute_features
    filter_features: filter_features
    get_objectives: get_objectives
    on_trial_end: on_trial_end                        # keep only if you `import optuna` in the stage

# ---- optimizer ----
param_gen: PopulationAnnealing
param_gen_source: nested.optimize_utils
optimization_title: EC_multidendrite_pop_anneal

# optional PA knobs (else set via CLI)
# param_gen_kwargs:
#   pop_size: 3
#   path_length: 1

# ---- starting point (optional) ----
x0:
  tau_ms: 50.0
  dend_threshold: -50.0
  weights_mean: 0.5
  weights_std: 0.5



