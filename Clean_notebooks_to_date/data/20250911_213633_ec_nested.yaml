imports:
  - nested.optimize_utils      # has PopulationAnnealingOptimizer
  - ec_nested_stage            # your local stage module

feature_names:
  - mean_novel_explore_plateaus_outside_reward
  - mean_fixed_reward_plateaus_inside_reward
  - mean_fixed_reward_plateaus_outside_reward
  - mean_familiar_explore_plateaus_outside_reward
  - plateaus_in_reward_mean_residuals
  - plateaus_out_reward_mean_residuals
  - CA1_mean_activity_residuals

objective_names:
  - total_error

stages:
  - source: ec_nested_stage
    get_args_static: get_args
    compute_features: compute_features
    filter_features: filter_features
    get_objectives: get_objectives

bounds:
  tau_ms:         [5.0, 200.0]
  dend_threshold: [-75.0, -65.0]
  weights_mean:   [0.1, 1.0]
  weights_std:    [0.1, 1.0]

# tell nested which class and where to import it from
param_gen: OptunaOptimizer
param_gen_source: nested.optimize_utils

optimization_title: EC_multidendrite_optuna

x0:
  tau_ms: 50.0
  dend_threshold: -70.0
  weights_mean: 0.5
  weights_std: 0.5

kwargs:
  data_root: /Users/michaelfinch/CA1-interneuron-GLM
  animal: animal_3
  weight_dist: Uniform
  inner_jobs: 1
  network_start_seed: 0
  num_network_seeds: 5

