# --- Search space ---
bounds:
  tau_ms:         [5.0, 200.0]
  dend_threshold: [-65.0, -25.0]
  weights_mean:   [0.1, 1.0]
  weights_std:    [0.1, 1.0]

# --- Context kwargs (become attributes on `context`) ---
kwargs:
  data_root: /Users/michaelfinch/CA1-interneuron-GLM
  animal: animal_3
  dist: "Lognormal"
  vel_applied: "real"
  use_averaged_velocity: "actual_velocity"
  add_inh: "neither"
  make_it_spike: true
  SST_bias_multi: 1.4
  dt_constant: 0.0001
  tau_ms: 5.0
  dend_threshold: -70
  network_start_seed: 0
  num_network_seeds: 5

# The features your stage returns
feature_names:
  - total_error
  - m_mean_total
  - m_violations
  - m_frac_active
  - m_f12_active
  - m_mse_total
  - m_mse_frac
  - m_pen_sparsity
  - m_pen_12only

# Which objectives to optimize (names must be produced by get_objectives())
objective_names:
  - total_error

# --- Where to get features from (pipeline of stages) ---
get_features_stages:
  - source: Clean_notebooks_to_date.ec_nested_stage   # importable module
    config_worker: config_worker                      # function name in that module
    get_args_static: get_args                         # function name in that module
    compute_features: compute_features                # function name in that module
    filter_features: filter_features                  # function name in that module

# --- Function that maps features -> objectives ---
# Provide a mapping from objective name -> {source, function}
# so the optimizer knows which module to import.
get_objectives:
  total_error:
    source: Clean_notebooks_to_date.ec_nested_stage
    function: get_objectives

# --- Optimizer settings (Population Annealing) ---
param_gen: PopulationAnnealing
param_gen_source: nested.optimize_utils
optimization_title: EC_multidendrite_pop_anneal

# Optional starting point
x0:
  tau_ms: 50.0
  dend_threshold: -50.0
  weights_mean: 0.5
  weights_std: 0.5



